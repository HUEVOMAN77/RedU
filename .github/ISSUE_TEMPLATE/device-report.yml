name: Informe de compatibilidad / Device report
description: Cuéntanos cómo funciona RedU en tu teléfono (modelo, Android, GPU, si corre y qué tal).
title: "[Device] "
labels: ["device report"]
body:
  - type: markdown
    attributes:
      value: |
        Este informe llena la tabla de compatibilidad de RedU.
        Con los datos de varios teléfonos podemos ir adaptando el port a más equipos.

        This report fills the compatibility table of RedU.

        **No incluyas archivos del juego ni claves.** El log de la app no tiene datos del juego,
        pero revisa lo que vas a pegar.

  - type: input
    id: model
    attributes:
      label: Modelo del teléfono / Phone model
      description: Marca y modelo exactos, tal como aparecen en Ajustes → Acerca del teléfono.
      placeholder: HUAWEI NCO-LX3 (Nova 10)
    validations:
      required: true

  - type: input
    id: android
    attributes:
      label: Versión de Android / Android version
      description: Con el nivel de API si lo sabes.
      placeholder: 12 (API 31)
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: Procesador y GPU / SoC and GPU
      description: Por ejemplo: Snapdragon 778G, Adreno 642L.
      placeholder: Snapdragon 778G, Adreno 642L
    validations:
      required: true

  - type: input
    id: driver
    attributes:
      label: Driver Vulkan / Vulkan driver
      description: La versión de Vulkan y la del driver. Sale en el log de la app.
      placeholder: Vulkan 1.1.128, driver 512.530.0

  - type: dropdown
    id: result
    attributes:
      label: ¿Funciona? / Does it work?
      options:
        - Corre y se juega bien / Runs and plays fine
        - Corre, pero con errores gráficos / Runs, with graphical errors
        - La app se instala pero el juego no arranca / The app installs but the game does not start
        - Falla durante la preparación / Fails during the setup
        - Todavía no lo he probado / Not tested yet
    validations:
      required: true

  - type: dropdown
    id: rating
    attributes:
      label: ¿Qué tal corre? / How good is it?
      description: "5 = perfecto, 1 = no funciona. Califica la experiencia en ese teléfono."
      options:
        - "5/5 — Perfecto / Perfect"
        - "4/5 — Bien, con una limitación menor / Good, with a minor limit"
        - "3/5 — Funciona pero se nota limitado / Works but feels limited"
        - "2/5 — Solo con driver propio, o con errores / Only with a custom driver, or with errors"
        - "1/5 — No funciona / Does not run"
    validations:
      required: true

  - type: input
    id: fps
    attributes:
      label: Cuadros por segundo / Frames per second
      description: El número que ves en el overlay (FPS / PROM / 1%), y el modo que usabas.
      placeholder: 60 fps (o 120 fps con tope), 30 fps

  - type: dropdown
    id: panel
    attributes:
      label: Tasa de refresco de la pantalla / Screen refresh rate
      options:
        - "60 Hz"
        - "90 Hz"
        - "120 Hz"
        - "144 Hz"
        - "165 Hz"
        - "240 Hz o más / or more"
        - "No lo sé / I do not know"
    validations:
      required: true

  - type: dropdown
    id: custom_driver
    attributes:
      label: Driver Vulkan propio / Custom Vulkan driver
      options:
        - "No, el del sistema / No, the system one"
        - "Turnip (Mesa)"
        - "Otro / Other"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: ¿Qué pasó? / What happened?
      description: Qué sentiste: velocidad, errores gráficos, calentamiento, fallos de la preparación.
      placeholder: El mapa del mundo va a 35 pasos por segundo y se siente lento.
    validations:
      required: false

  - type: textarea
    id: log
    attributes:
      label: Log / Log
      description: |-
        El log de la app: mantén presionado el ícono y elige *Compartir log*, o el botón *Compartir
        log* de la pantalla de preparación. Pega aquí el texto.

        Sin claves ni archivos del juego, por favor.
    validations:
      required: false

  - type: checkboxes
    id: consent
    attributes:
      label: Permisos / Permissions
      options:
        - label: |-
            Puedes poner mi modelo y mis resultados en la tabla de compatibilidad de RedU.
            You may list my model and my results in the RedU compatibility table.
          required: true
        - label: |-
            Acepto las reglas del repositorio y no voy a adjuntar archivos del juego ni claves.
            I accept the repository rules and will not attach game files or keys.
          required: true
